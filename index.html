<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-primary: #070913;
      --bg-secondary: #0e1326;
      --bg-card: rgba(18, 25, 48, 0.78);
      --bg-glass: rgba(14, 19, 38, 0.88);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-cyan: #00f5d4;
      --accent-purple: #9b5de5;
      --accent-pink: #f15bb5;
      --accent-amber: #fee440;
      --border-color: rgba(0, 245, 212, 0.22);
      --shadow-neon: 0 0 25px rgba(0, 245, 212, 0.18);
      --brightness: 100%;
    }

    [data-theme="light"] {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-glass: rgba(255, 255, 255, 0.92);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-cyan: #0284c7;
      --accent-purple: #7c3aed;
      --accent-pink: #db2777;
      --accent-amber: #d97706;
      --border-color: rgba(2, 132, 199, 0.25);
      --shadow-neon: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
    }

    html {
      filter: brightness(var(--brightness));
      transition: filter 0.15s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(155, 93, 229, 0.14), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(0, 245, 212, 0.12), transparent 35%);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .brand-font {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1.5px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.9rem 5%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #070913;
      font-weight: 900;
      box-shadow: 0 0 18px rgba(0, 245, 212, 0.45);
    }

    .logo-text {
      font-size: 1.45rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    .brightness-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .brightness-box input[type="range"] {
      width: 85px;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

      outline: none;
      cursor: pointer;
